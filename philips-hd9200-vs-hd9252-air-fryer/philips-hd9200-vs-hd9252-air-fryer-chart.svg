<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Philips HD9200 vs HD9252 - verified specs</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#666">Source: philips.co.in official spec sheets (14 Aug 2026)</text>

  <!-- column headers -->
  <rect x="20" y="70" width="120" height="34" fill="#f0f0f0" stroke="#ccc"/>
  <text x="80" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Spec</text>
  <rect x="150" y="70" width="285" height="34" fill="#e8f0fe" stroke="#ccc"/>
  <text x="292" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b3d91">HD9200/90</text>
  <rect x="445" y="70" width="295" height="34" fill="#e6f7ee" stroke="#ccc"/>
  <text x="592" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#0a6b3d">HD9252/90</text>

  <!-- rows -->
  <g font-size="13">
    <text x="80" y="130" text-anchor="middle" font-weight="bold" fill="#333">Capacity</text>
    <rect x="150" y="114" width="285" height="24" fill="#f7f7f7"/><text x="292" y="131" text-anchor="middle" fill="#222">4.1 L</text>
    <rect x="445" y="114" width="295" height="24" fill="#f7f7f7"/><text x="592" y="131" text-anchor="middle" fill="#222">4.1 L</text>

    <text x="80" y="170" text-anchor="middle" font-weight="bold" fill="#333">Power</text>
    <rect x="150" y="154" width="285" height="24" fill="#f7f7f7"/><text x="292" y="171" text-anchor="middle" fill="#222">1400 W</text>
    <rect x="445" y="154" width="295" height="24" fill="#f7f7f7"/><text x="592" y="171" text-anchor="middle" fill="#222">1400 W</text>

    <text x="80" y="210" text-anchor="middle" font-weight="bold" fill="#333">Max temp</text>
    <rect x="150" y="194" width="285" height="24" fill="#f7f7f7"/><text x="292" y="211" text-anchor="middle" fill="#222">200 &deg;C</text>
    <rect x="445" y="194" width="295" height="24" fill="#f7f7f7"/><text x="592" y="211" text-anchor="middle" fill="#222">200 &deg;C</text>

    <text x="80" y="250" text-anchor="middle" font-weight="bold" fill="#333">Presets</text>
    <rect x="150" y="234" width="285" height="24" fill="#f7f7f7"/><text x="292" y="251" text-anchor="middle" fill="#222">7</text>
    <rect x="445" y="234" width="295" height="24" fill="#f7f7f7"/><text x="592" y="251" text-anchor="middle" fill="#222">7</text>

    <text x="80" y="290" text-anchor="middle" font-weight="bold" fill="#333">Warranty</text>
    <rect x="150" y="274" width="285" height="24" fill="#f7f7f7"/><text x="292" y="291" text-anchor="middle" fill="#222">2 years</text>
    <rect x="445" y="274" width="295" height="24" fill="#f7f7f7"/><text x="592" y="291" text-anchor="middle" fill="#222">2 years</text>

    <!-- the two differing rows -->
    <text x="80" y="330" text-anchor="middle" font-weight="bold" fill="#0b3d91">Interface</text>
    <rect x="150" y="314" width="285" height="24" fill="#fdecea" stroke="#d99"/>
    <text x="292" y="331" text-anchor="middle" fill="#a00">Analogue (dial)</text>
    <rect x="445" y="314" width="295" height="24" fill="#e6f7ee" stroke="#6b9"/>
    <text x="592" y="331" text-anchor="middle" font-weight="bold" fill="#0a6b3d">Digital (touch screen)</text>

    <text x="80" y="370" text-anchor="middle" font-weight="bold" fill="#0b3d91">Keep warm</text>
    <rect x="150" y="354" width="285" height="24" fill="#fdecea" stroke="#d99"/>
    <text x="292" y="371" text-anchor="middle" fill="#a00">No</text>
    <rect x="445" y="354" width="295" height="24" fill="#e6f7ee" stroke="#6b9"/>
    <text x="592" y="371" text-anchor="middle" font-weight="bold" fill="#0a6b3d">Yes (up to 30 min)</text>
  </g>

  <text x="380" y="408" text-anchor="middle" font-size="11" fill="#666">Identical specs are grey; the two real differences (interface and keep-warm) are highlighted.</text>
</svg>
