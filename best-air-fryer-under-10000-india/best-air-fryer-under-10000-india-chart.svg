<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="20" y="34" font-size="19" font-weight="bold" fill="#1a1a1a">Air fryers under Rs 10,000: selling price on Tata CLiQ</text>
  <text x="20" y="54" font-size="12" fill="#555">Selling prices pulled from Tata CLiQ listings, 17 August 2026. Prices move with sales.</text>

  <line x1="150" y1="78" x2="150" y2="300" stroke="#d0d0d0" stroke-width="1"/>
  <text x="150" y="315" font-size="11" fill="#777" text-anchor="middle">Rs 0</text>
  <line x1="216" y1="78" x2="216" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="282" y1="78" x2="282" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="348" y1="78" x2="348" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="414" y1="78" x2="414" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="480" y1="78" x2="480" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <text x="216" y="315" font-size="11" fill="#777" text-anchor="middle">Rs 2,500</text>
  <text x="282" y="315" font-size="11" fill="#777" text-anchor="middle">Rs 5,000</text>
  <text x="348" y="315" font-size="11" fill="#777" text-anchor="middle">Rs 7,500</text>
  <text x="414" y="315" font-size="11" fill="#777" text-anchor="middle">Rs 10,000</text>

  <!-- scale: 150px = Rs 0, 66px per Rs 5,000 => 0.0132 px/rupee. x = 150 + price*0.0132 -->
  <!-- Judge by Prestige InstaAir Rs 3,325 -->
  <text x="20" y="98" font-size="12" fill="#333">Judge by Prestige InstaAir (4L, 1200W)</text>
  <rect x="193.9" y="84" width="9" height="16" fill="#f59e0b"/>
  <text x="206" y="98" font-size="11" fill="#333">Rs 3,325</text>

  <!-- Philips NA120/00 Rs 5,290 -->
  <text x="20" y="128" font-size="12" fill="#333">Philips NA120/00 (4.2L, 1500W)</text>
  <rect x="219.8" y="114" width="9" height="16" fill="#1d4ed8"/>
  <text x="232" y="128" font-size="11" fill="#333">Rs 5,290</text>

  <!-- Prestige MultiChef 4in1 Rs 5,385 -->
  <text x="20" y="158" font-size="12" fill="#333">Prestige MultiChef 4in1 (6.5L, 1200W)</text>
  <rect x="221.1" y="144" width="9" height="16" fill="#16a34a"/>
  <text x="233" y="158" font-size="11" fill="#333">Rs 5,385</text>

  <!-- Wonderchef Evita Digital 6.5L Rs 5,699 -->
  <text x="20" y="188" font-size="12" fill="#333">Wonderchef Evita Digital (6.5L, 1600W)</text>
  <rect x="225.2" y="174" width="9" height="16" fill="#0d9488"/>
  <text x="237" y="188" font-size="11" fill="#333">Rs 5,699</text>

  <!-- Hafele NOIL 6.3L Rs 9,949 -->
  <text x="20" y="218" font-size="12" fill="#333">Hafele NOIL (6.3L, 1700W)</text>
  <rect x="281.3" y="204" width="9" height="16" fill="#b91c1c"/>
  <text x="293" y="218" font-size="11" fill="#333">Rs 9,949</text>

  <text x="20" y="262" font-size="11" fill="#777">Prices are today's selling prices on Tata CLiQ, not MRP. All five stay under the Rs 10,000 ceiling.</text>
</svg>