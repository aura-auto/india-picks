<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Price and rating of study desk lamps on Amazon.in</title>
  <desc id="d">Horizontal bars showing price in rupees for six study desk lamps, with their star rating labelled.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">Price (Rs.) and rating for the six study desk lamps compared</text>
  <text x="320" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Live Amazon.in listings, prices checked 12 August 2026</text>

  <!-- axis -->
  <line x1="120" y1="60" x2="120" y2="315" stroke="#cccccc" stroke-width="1"/>
  <text x="110" y="305" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">0</text>
  <text x="110" y="240" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">300</text>
  <text x="110" y="175" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">600</text>
  <text x="110" y="110" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">900</text>
  <text x="110" y="75" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">1200</text>

  <!-- FLYNGO 375 (scale ~ -0.16 px/Rs ; 375->~90px) -->
  <rect x="120" y="62" width="92" height="22" fill="#4a90d9"/>
  <text x="128" y="77" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff">Rs.375</text>
  <text x="220" y="77" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">FLYNGO rechargeable  |  4.2 stars</text>

  <!-- Claro 557 -> ~137px -->
  <rect x="120" y="100" width="137" height="22" fill="#4a90d9"/>
  <text x="128" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff">Rs.557</text>
  <text x="264" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Philips Claro 5W  |  4.1 stars</text>

  <!-- Agaro 727 -> ~179px -->
  <rect x="120" y="138" width="179" height="22" fill="#7a77d9"/>
  <text x="128" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff">Rs.727</text>
  <text x="306" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Agaro Regal 5W  |  4.2 stars</text>

  <!-- Lynor 799 -> ~197px -->
  <rect x="120" y="176" width="197" height="22" fill="#7a77d9"/>
  <text x="128" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff">Rs.799</text>
  <text x="324" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Philips Lynor 5W  |  4.0 stars</text>

  <!-- Air 879 -> ~217px -->
  <rect x="120" y="214" width="217" height="22" fill="#50b370"/>
  <text x="128" y="229" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff">Rs.879</text>
  <text x="344" y="229" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Philips Air 5W  |  4.3 stars</text>

  <!-- Garnet 1243 -> ~306px -->
  <rect x="120" y="252" width="306" height="22" fill="#50b370"/>
  <text x="128" y="267" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff">Rs.1,243</text>
  <text x="433" y="267" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Wipro Garnet 6W  |  4.4 stars</text>

  <text x="320" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">Colours group budget, mid-price and premium tiers based on price only.</text>
</svg>
